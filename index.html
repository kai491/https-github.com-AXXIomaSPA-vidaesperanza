<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vida y Esperanza La Serena</title>
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/k2yKx60.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: var(--font-primary), sans-serif; }
      :root {
        --font-primary: 'Inter';
        --brand-50: #ecfdf5;
        --brand-100: #d1fae5;
        --brand-200: #a7f3d0;
        --brand-300: #6ee7b7;
        --brand-400: #34d399;
        --brand-500: #10b981;
        --brand-600: #059669;
        --brand-700: #047857;
        --brand-800: #065f46;
        --brand-900: #064e3b;
        --brand-950: #022c22;
        --accent-50: #eff6ff;
        --accent-100: #dbeafe;
        --accent-200: #bfdbfe;
        --accent-300: #93c5fd;
        --accent-400: #60a5fa;
        --accent-500: #3b82f6;
        --accent-600: #2563eb;
        --accent-700: #1d4ed8;
        --accent-800: #1e40af;
        --accent-900: #1e3a8a;
        --accent-950: #172554;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: var(--brand-500); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--brand-600); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
